<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#4FC3F7" opacity="0.15"/>

  <!-- Compensation curve -->
  <path d="M 40 200 Q 80 180, 100 140 Q 120 100, 150 70 Q 180 40, 220 35"
        fill="none"
        stroke="#1976D2"
        stroke-width="12"
        stroke-linecap="round"/>

  <!-- Thermometer body -->
  <rect x="170" y="90" width="28" height="100" rx="14" ry="14" fill="#E53935"/>

  <!-- Thermometer bulb -->
  <circle cx="184" cy="195" r="28" fill="#E53935"/>

  <!-- Thermometer inner (mercury level) -->
  <rect x="178" y="120" width="12" height="70" fill="#FFCDD2"/>
  <circle cx="184" cy="195" r="18" fill="#FFCDD2"/>

  <!-- Thermometer scale marks -->
  <line x1="200" y1="105" x2="210" y2="105" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="125" x2="210" y2="125" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="145" x2="210" y2="145" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="165" x2="210" y2="165" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>

  <!-- Curve arrow head -->
  <polygon points="220,35 205,50 215,55" fill="#1976D2"/>
</svg>
